name: 🐛 Bug Report
description: Create a report to help us reproduce and fix an issue in RHEN
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues first.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal code snippet or CLI command that reproduces the issue.
      placeholder: |
        import rhen
        # Paste minimal reproduction code here
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Operating System, Python version, PyTorch version, and Transformers version.
      value: |
        - OS: [e.g. Ubuntu 22.04 / Windows 11 / macOS 14]
        - Python version: [e.g. 3.11.8]
        - PyTorch version: [e.g. 2.2.0]
        - Transformers version: [e.g. 4.40.1]
        - RHEN version: [e.g. 1.0.0]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback / Logs
      description: Full error traceback or logs.
      render: shell
