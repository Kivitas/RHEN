name: 💡 Feature Request
description: Propose a new feature, new primitive, or architectural enhancement for RHEN
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make RHEN better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of the new decision primitive, adapter, or capability you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've evaluated.
  - type: textarea
    id: context
    attributes:
      label: Additional Context & Use Cases
      description: Example code or real-world agent pipeline scenarios where this feature helps.
