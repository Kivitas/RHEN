name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pyflakes Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Run Pyflakes
        run: |
          python -m pyflakes $(git ls-files '*.py')

  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/ -q --maxfail=5 --junitxml=test-results.xml

      - name: Smoke Test CLI Entry Points
        run: |
          rhen-tasks --list-families
          rhen-tasks --out-dir smoke_bench --train 10 --val 10 --test 10 --ood 10
          rhen-eval --decision-dir smoke_bench --preset tiny --out smoke_bench/report.json
          rhen-decide --state '{"amount": 5000, "flagged": false}' --choice "Action" "Approve" "Review" --noul "Is Safe?"
          rhen-train --dry-run --train-data smoke_bench/train.jsonl --preset tiny

      - name: Verify Wheel Build
        run: |
          python -m build

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
